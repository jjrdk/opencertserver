# ---------------------------------------------------------------------------
# Manual equivalent of the two TestContainers the IQ scenarios use.
#   server : a running, hardened OpenCertServer (built from the repo root Dockerfile)
#   client : the Linux tool image that drives the server over the network
#
# This is for hands-on runs / debugging. TestContainers performs the same
# bring-up programmatically. The server is launched hardening-first:
#   TLS 1.2/1.3 only, no Server header, CAA on, device-attest-01 fail-closed,
#   EST Basic auth users (from a users file), and a profile that fixes
#   certificatePolicies/keyUsage/extendedKeyUsage.
# ---------------------------------------------------------------------------
services:
  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Hardening + profile config is injected the same way a real install does it:
    # the server reads command-line args + environment (see the root Dockerfile CMD
    # and docs/getting-started.md). TLS 1.2/1.3 is pinned by the server's Kestrel config.
    command:
      - "--authority=https://iq.test"
      - "--audience=https://iq.test"
      - "--ocsp=https://server:5001/ca/ocsp"
    environment:
      ASPNETCORE_URLS: "https://+:5001"
      # TLS 1.1+ per RFC 7030; the certserver pins 1.2/1.3 in its Kestrel config.
      "AcmeServer__CAAIdentities": "iq.test"
      "AcmeServer__DisableCaaChecks": "false"
    ports:
      - "5001:5001"
    # readiness probe mirrors Docker.md: the /health endpoint the K8s manifest uses.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -k https://localhost:5001/health | grep -q -i healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      # The client image COPYs a freshly built `opencert` binary (see ARG
      # OPENCERT_BINARY in client/Dockerfile). Build the binary first:
      #   dotnet publish src/opencertserver.cli -c Release -r linux-x64 --self-contained \
      #     -p:PublishSingleFile=true
      # then point the build arg at it.
      context: .
      args:
        OPENCERT_BINARY: /opt/opencertserver/opencert
    depends_on:
      server:
        condition: service_healthy
    # No command by default: the IQ runner issues `docker exec` into this image
    # to run the per-scenario tool invocations (curl / openssl / estclient /
    # acme.sh / jq / opencert).
    command: ["sleep", "infinity"]
